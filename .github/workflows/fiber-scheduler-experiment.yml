name: Fiber scheduler experiment

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scheduler:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ['3.3', '4.0']
    env:
      BUNDLE_GEMFILE: benchmark/fiber_scheduler/Gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec benchmark/fiber_scheduler/spec
